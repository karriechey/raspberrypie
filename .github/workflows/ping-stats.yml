name: ping stats

on:
  push:
    branches: [main]

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.STATS_TOKEN }}" -H "Accept: application/vnd.github+json" https://api.github.com/repos/karriechey/karriechey/dispatches -d '{"event_type":"update-stats"}'
